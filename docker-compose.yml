services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: steamtwo
      POSTGRES_USER: steamtwo
      POSTGRES_PASSWORD: steamtwo
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steamtwo -d steamtwo"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - steamtwo_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://steamtwo:steamtwo@postgres:5432/steamtwo
      STEAM_COUNTRY: ${STEAM_COUNTRY:-BR}
      EPIC_LOCALE: ${EPIC_LOCALE:-pt-BR}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://steamtwo:steamtwo@postgres:5432/steamtwo
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run db:migrate
    restart: "no"

volumes:
  steamtwo_pgdata:
    external: true
    name: bab-steam-epic_steamtwo_pgdata

